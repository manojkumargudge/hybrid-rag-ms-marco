name: Release image

on:
  pull_request:
    paths:
      - .github/workflows/release-image.yml
      - .dockerignore
      - scripts/check_release_image.sh
      - scripts/publish_image.py
      - scripts/scan_image_security.sh
      - scripts/security_gate.py
      - .github/security-ignore.json
      - scripts/fetch_artifacts.py
      - scripts/docker_smoke*.py
      - scripts/download_models.py
      - .github/workflows/ci.yml
      - app/**
      - manifests/v3.json
      - requirements.lock
      - Dockerfile
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the checked main commit to GHCR
        type: boolean
        default: false
      commit_sha:
        description: Full main commit SHA to verify
        type: string
        required: true

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'pull_request' || (github.ref == 'refs/heads/main' && !inputs.publish)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Build and validate without publishing
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
        run: bash scripts/check_release_image.sh

  release-gates:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'manojkumargudge/hybrid-rag-ms-marco' && inputs.publish && inputs.commit_sha == github.sha
    uses: ./.github/workflows/ci.yml

  publish:
    needs: release-gates
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'manojkumargudge/hybrid-rag-ms-marco' && inputs.publish && inputs.commit_sha == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: ghcr-release
    concurrency:
      group: ghcr-release-${{ github.sha }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check the requested revision
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
        run: test "$REQUESTED_SHA" = "$GITHUB_SHA"
      - name: Require publication to be enabled
        env:
          GHCR_RELEASE_ENABLED: ${{ secrets.GHCR_RELEASE_ENABLED }}
        run: test "$GHCR_RELEASE_ENABLED" = true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Build and validate the release candidate
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
        run: bash scripts/check_release_image.sh
      - name: Publish the checked image under its commit SHA
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
          PUBLISH_REQUESTED: ${{ inputs.publish }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m scripts.publish_image
