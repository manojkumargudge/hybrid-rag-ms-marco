name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install locked dependencies (hash-checked)
        run: >
          pip install --no-deps --require-hashes
          --extra-index-url https://download.pytorch.org/whl/cpu
          -r requirements-dev.lock
      - name: Check lockfiles match requirements
        run: |
          pip install uv==0.13.8
          sh scripts/lock_deps.sh
          git diff --exit-code -- requirements.lock requirements-dev.lock
      - name: Lint
        run: ruff check app evaluation tests scripts
      - name: Strict type checks
        run: mypy --strict app/artifacts.py app/generation/citations.py
      - name: Test and enforce application coverage
        run: |
          coverage run --source=app -m pytest -q
          coverage report --fail-under=90

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install audit tools
        run: pip install pip-audit==2.10.1 bandit==1.9.4
      - name: pip-audit (lockfiles, strict) + bandit -ll (app/)
        run: sh scripts/security_audit.sh
      - name: Scan the tracked release tree for secrets
        run: bash scripts/scan_release_secrets.sh

  docker:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Build image (no data/indices in context)
        run: docker build -t hybrid-rag:ci .
      - name: Report image size
        run: |
          docker image inspect hybrid-rag:ci --format '{{.Size}}' \
            | awk '{printf "image_size_bytes=%d (%.1f MB)\n", $1, $1/1e6}' \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Download and verify the released dense v3 artifacts
        run: python -m scripts.fetch_artifacts --dense-only
      - name: Exercise the offline container and verify shutdown
        run: python -m scripts.docker_smoke --image hybrid-rag:ci
      - name: Rehearse a failed deployment and rollback with Compose
        run: bash scripts/operations_smoke.sh hybrid-rag:ci
