services:
  hybrid-rag:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hybrid-rag
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Artifacts are mounted, never baked into the image.
      - ./data:/app/data:ro
      - ./indices:/app/indices:ro
    restart: unless-stopped
