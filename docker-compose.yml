services:
  hybrid-rag:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hybrid-rag
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Artifacts are mounted, never baked into the image. Every file is
      # sha256-checked against manifest.json before it is loaded.
      - ./artifacts/v2:/app/artifacts/v2:ro
    restart: unless-stopped
