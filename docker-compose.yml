services:
  hybrid-rag:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      # Host port from API_PORT in .env (default 8000); the app listens on 8000.
      - "${API_PORT:-8000}:8000"
    env_file:
      - .env
    volumes:
      # Artifacts are mounted, never baked into the image. Every file is
      # sha256-checked against manifest.json before it is loaded.
      - ./artifacts/v3:/app/artifacts/v3:ro
    restart: unless-stopped
