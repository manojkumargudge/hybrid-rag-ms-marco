services:
  hybrid-rag:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      # Host port from API_PORT in .env (default 8000); the app listens on 8000.
      - "${API_PORT:-8000}:8000"
    env_file:
      - .env
    volumes:
      # Artifacts are mounted, never baked into the image. Every file is
      # SHA-256 checked against the v3 manifest baked into the image.
      - ./artifacts/v3:/app/artifacts/v3:ro
    cpus: "${API_CPUS:-2.0}"
    mem_limit: "${API_MEMORY_LIMIT:-4g}"
    stop_grace_period: 45s
    restart: unless-stopped
